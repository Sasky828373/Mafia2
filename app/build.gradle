plugins { id 'com.android.application' }

android {
    namespace 'com.m2port.bootstrap'
    compileSdk 35

    defaultConfig {
        applicationId 'com.m2port.bootstrap'
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName '0.4-arm64-host'
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild {
            cmake {
                cppFlags '-std=c++20 -O3 -DNDEBUG -fvisibility=hidden -fno-exceptions -fno-rtti'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    packaging {
        jniLibs { useLegacyPackaging = true }
    }
}
