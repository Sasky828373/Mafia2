name: Recomp Tooling

on:
  push:
    paths:
      - 'tools/**'
      - 'tests/**'
      - '.github/workflows/recomp-tooling.yml'
  pull_request:
    paths:
      - 'tools/**'
      - 'tests/**'
      - '.github/workflows/recomp-tooling.yml'
  workflow_dispatch:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install IA-32 decoder
        run: python3 -m pip install capstone==5.0.6
      - name: Validate Python tooling
        run: python3 -m py_compile tools/*.py tests/*.py
      - name: CLI smoke tests
        run: |
          python3 tools/pe_inventory.py --help
          python3 tools/x86_cfg.py --help
          python3 tools/x86_cfg_capstone.py --help
          python3 tools/recomp_ir.py --help
          python3 tools/x86_to_ir.py --help
          python3 tools/full_recomp.py --help
      - name: IR/codegen smoke tests
        run: |
          python3 tests/test_recomp_ir.py
          python3 tests/test_x86_to_ir.py
          python3 tests/test_modrm.py
