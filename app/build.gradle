plugins { id 'com.android.application' }

android {
    namespace 'com.m2port.bootstrap'
    compileSdk 35
    defaultConfig {
        applicationId 'com.m2port.bootstrap'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1-bootstrap'
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild { cmake { cppFlags '-std=c++20 -O2 -fvisibility=hidden' } }
    }
    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }
}
